# AI Task Capture Automation - Configuration File
# Copy this to config.yml and fill in your details

# Where your tasks come from
transcript_source:
  type: google_drive  # Options: google_drive, email, slack, plain_text

  # Google Drive settings (if type: google_drive)
  google_drive:
    # List all Google accounts to monitor
    accounts:
      - email: you@example.com
        label: main  # Short name for this account
        folder_name: "meet recordings"  # Name of folder containing transcripts
      # - email: work@company.com
      #   label: work
      #   folder_name: "meet recordings"

    # OAuth credentials file (create via Google Cloud Console)
    client_secret_file: client_secret.json

  # Email settings (if type: email)
  # email:
  #   accounts:
  #     - email: you@example.com
  #       label: main
  #     - email: work@company.com
  #       label: work
  #   client_secret_file: client_secret.json  # Same as Google Drive
  #   search_query: "is:unread"  # Gmail search query

  # Slack settings (if type: slack)
  # slack:
  #   workspaces:
  #     - name: "Work"
  #       bot_token_env: SLACK_BOT_TOKEN_WORK
  #       channels_to_monitor:
  #         - id: C0123456789
  #           name: "product-team"
  #         - id: C9876543210
  #           name: "eng-team"
  #     - name: "Client ABC"
  #       bot_token_env: SLACK_BOT_TOKEN_CLIENT
  #       channels_to_monitor:
  #         - id: C1111111111
  #           name: "requests"
  #   max_messages_per_channel: 100

  # Plain text settings (if type: plain_text)
  # plain_text:
  #   text: "Your text content here"  # Direct text
  #   # OR
  #   file: "path/to/notes.txt"  # Path to text file

# Which AI provider to use for extracting tasks from transcripts
llm_provider:
  type: gemini  # Options: gemini, openai (coming soon), claude (coming soon), ollama (coming soon)

  # Gemini settings
  gemini:
    api_key_env: GEMINI_API_KEY  # Environment variable containing API key
    model: gemini-2.5-flash-preview-05-20  # Or: gemini-pro, gemini-2.5-pro-preview-03-25

  # OpenAI settings (coming soon)
  # openai:
  #   api_key_env: OPENAI_API_KEY
  #   model: gpt-4

  # Ollama settings (self-hosted, coming soon)
  # ollama:
  #   host: http://localhost:11434
  #   model: llama2

# Where to create the extracted tasks
task_manager:
  type: asana  # Options: asana, notion, linear, todoist (coming soon)

  # Asana settings (teams/agencies)
  asana:
    api_key_env: ASANA_TOKEN  # Environment variable containing personal access token
    workspace_id: "1234567890"  # Find at: https://app.asana.com/api/1.0/workspaces
    project_id: "0987654321"  # Default project for new tasks

  # Notion settings (individuals/small teams)
  # notion:
  #   api_key_env: NOTION_API_KEY  # From: https://www.notion.so/my-integrations
  #   database_id: "abc123def456"  # From database URL

  # Linear settings (engineering teams)
  # linear:
  #   api_key_env: LINEAR_API_KEY  # From: https://linear.app/settings/api
  #   team_id: "TEAM_abc123"  # From team URL
  #   project_id: "PROJECT_xyz789"  # Optional: default project

  # Todoist settings (coming soon)
  # todoist:
  #   api_key_env: TODOIST_API_KEY
  #   project_id: "2123456789"

# Email notifications (optional)
notifications:
  enabled: true  # Set to false to disable
  email_from: you@example.com
  email_to: you@example.com

  # Gmail SMTP settings
  smtp:
    server: smtp.gmail.com
    port: 587
    password_env: GMAIL_APP_PASSWORD  # Use app password, not your real password!
    # Get app password: https://myaccount.google.com/apppasswords

# Automation settings
automation:
  check_interval: 3600  # How often to check for new transcripts (seconds). 3600 = 1 hour

  # Lookback window for first run (hours)
  initial_lookback: 24  # Only check last 24 hours on first run

  # Logging
  log_file: automation.log
  log_level: INFO  # Options: DEBUG, INFO, WARNING, ERROR

# Advanced settings (optional)
advanced:
  # Skip transcripts already processed
  processed_log: processed_transcripts.json

  # Maximum transcript size to process (characters)
  max_transcript_size: 500000

  # Retry settings for API calls
  max_retries: 3
  retry_delay: 5  # seconds

# RAG Configuration (for chatbot)
rag:
  # Vector database settings
  vector_store:
    persist_directory: "./data/chroma_db"
    embedding_model: "all-MiniLM-L6-v2"  # Fast and efficient
    # Alternative: "all-mpnet-base-v2" (more accurate, slower)
  
  # Retrieval settings
  retrieval:
    n_results: 5  # Number of chunks to retrieve
    chunk_size: 500  # Words per chunk
    chunk_overlap: 50  # Overlap between chunks
  
  # Chat settings
  chat:
    max_history: 10  # Keep last N conversation turns
    confidence_threshold: 0.5  # Minimum confidence for answers

# Guardrails Configuration (for department-wise access control)
guardrails:
  # Input validation
  input:
    enable_keyword_blocking: true
    enable_pii_detection: true
    enable_cross_department_check: true
    max_query_length: 500  # characters
    rate_limit:
      queries_per_hour: 50
      queries_per_day: 200
  
  # Output filtering
  output:
    enable_source_filtering: true
    enable_content_redaction: true
    enable_sensitivity_classification: true
    show_redaction_count: true
  
  # Audit logging
  audit:
    enable_logging: true
    log_file: "./data/audit.log"
    log_blocked_queries: true
    log_redactions: true
    retention_days: 90

# User Management (for chatbot access control)
users:
  database_file: "./data/users.json"
  require_authentication: true
  session_timeout_minutes: 480  # 8 hours
  
  # Default permissions
  default_permissions:
    viewer:
      can_query: true
      can_export: false
      can_see_sources: true
    member:
      can_query: true
      can_export: true
      can_see_sources: true
    manager:
      can_query: true
      can_export: true
      can_see_sources: true
      can_see_audit_logs: true
    admin:
      can_query: true
      can_export: true
      can_see_sources: true
      can_see_audit_logs: true
      can_manage_users: true
